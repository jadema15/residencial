version: "3.8"
services:
  app:
    build: .
    ports:
      - "8080:8086"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/conjunto?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""

  db:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: conjunto
      MYSQL_ROOT_PASSWORD: ""
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
