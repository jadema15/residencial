name: CI/CD Spring Boot Docker

on:
  push:
    branches:
      - dev_sin_bd

jobs:
  build-and-docker:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: sudo docker build -t conjunto-app .

      - name: Run Docker container
        run: |
          sudo docker stop conjunto-app-container || true
          sudo docker rm conjunto-app-container || true
          sudo docker run -d -p 9092:8080 --name conjunto-app-container conjunto-app
